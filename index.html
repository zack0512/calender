<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端行事曆 - 除錯版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans p-4">

  <div class="max-w-md mx-auto space-y-4">
    <div class="bg-white rounded-xl shadow-md p-6">
      <h1 class="text-2xl font-bold text-center mb-4 text-blue-600">雲端行事曆登入測試</h1>
      
      <!-- 錯誤/成功訊息顯示區 -->
      <div id="debug-msg" class="mb-4 p-3 rounded-lg text-sm bg-yellow-50 text-yellow-800 border border-yellow-200">
        準備就緒，請嘗試註冊或登入。
      </div>

      <div class="space-y-3">
        <input type="email" id="email" placeholder="電子郵件 (例如 test@gmail.com)" class="w-full border p-2 rounded-lg text-sm">
        <input type="password" id="password" placeholder="密碼 (至少6位數)" class="w-full border p-2 rounded-lg text-sm">
        
        <div class="flex gap-2 pt-2">
          <button onclick="tryRegister()" class="flex-1 bg-green-600 text-white py-2 rounded-lg text-sm font-bold">註冊新帳號</button>
          <button onclick="tryLogin()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg text-sm font-bold">登入帳號</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBZ9s5Ku8aEzaVEmk_7ztbIiHXI6qmz5H0",
      authDomain: "my-project-zack0512.firebaseapp.com",
      databaseURL: "https://my-project-zack0512-default-rtdb.firebaseio.com",
      projectId: "my-project-zack0512",
      storageBucket: "my-project-zack0512.firebasestorage.app",
      messagingSenderId: "972310414233",
      appId: "1:972310414233:web:39c19e88ee71c22b530908",
      measurementId: "G-BVFSR4Z3B5"
    };

    try {
      firebase.initializeApp(firebaseConfig);
    } catch (e) {
      console.error(e);
    }
    
    const auth = firebase.auth();

    function showBox(text, isError = false) {
      const box = document.getElementById('debug-msg');
      box.innerText = text;
      box.className = `mb-4 p-3 rounded-lg text-sm ${isError ? 'bg-red-100 text-red-700 border border-red-300' : 'bg-emerald-100 text-emerald-800 border border-emerald-300'}`;
    }

    function tryRegister() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      if (!email || !password) {
        showBox('請輸入完整信箱與密碼！', true);
        return;
      }

      showBox('正在送出註冊請求...');
      auth.createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
          showBox('註冊成功！使用者 ID: ' + userCredential.user.uid);
        })
        .catch((error) => {
          showBox('註冊失敗代碼: ' + error.code + '\n錯誤訊息: ' + error.message, true);
        });
    }

    function tryLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      if (!email || !password) {
        showBox('請輸入完整信箱與密碼！', true);
        return;
      }

      showBox('正在送出登入請求...');
      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          showBox('登入成功！歡迎回來：' + userCredential.user.email);
        })
        .catch((error) => {
          showBox('登入失敗代碼: ' + error.code + '\n錯誤訊息: ' + error.message, true);
        });
    }
  </script>
</body>
</html>
