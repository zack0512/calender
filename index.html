<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>沙沙雲端行事曆</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK v8 (相容性佳) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <div class="max-w-4xl mx-auto p-4 md:p-6">
    <!-- 頂部導覽列 -->
    <header class="bg-white rounded-xl shadow-md p-5 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 text-white p-3 rounded-lg shadow-sm">
          <i class="fa-solid fa-calendar-days text-2xl"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-slate-800">雲端行事曆</h1>
          <p class="text-xs text-slate-500">支援分類標籤 & 提醒通知</p>
        </div>
      </div>

      <!-- 登入表單 -->
      <div id="logged-out-box" class="w-full md:w-auto">
        <div class="flex flex-col sm:flex-row gap-2 items-center">
          <input type="email" id="email" placeholder="電子郵件" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm w-full sm:w-40 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <input type="password" id="password" placeholder="密碼(至少6碼)" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm w-full sm:w-36 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <div class="flex gap-2 w-full sm:w-auto">
            <button onclick="handleLogin()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg text-sm transition flex-1 sm:flex-none">登入</button>
            <button onclick="handleRegister()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-sm transition flex-1 sm:flex-none">註冊</button>
          </div>
        </div>
      </div>

      <!-- 已登入狀態與通知按鈕 -->
      <div id="logged-in-box" class="hidden flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
        <div class="text-right">
          <span id="user-email" class="text-sm font-semibold text-slate-700 block"></span>
          <div class="flex items-center gap-2 mt-0.5">
            <span class="text-xs text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200"><i class="fa-solid fa-cloud"></i> 已連線</span>
            <button onclick="requestNotificationPermission()" id="btn-notify" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full border border-slate-300">
              <i class="fa-solid fa-bell"></i> 開啟通知
            </button>
          </div>
        </div>
        <button onclick="handleLogout()" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-sm transition font-medium">登入/登出</button>
      </div>
    </header>

    <!-- 訊息提示 -->
    <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

    <!-- 主內容區 (登入後顯示) -->
    <main id="app-main" class="hidden space-y-6">
      
      <!-- 分類篩選與控制 -->
      <div class="bg-white rounded-xl shadow-md p-4 flex flex-col sm:flex-row justify-between items-center gap-3">
        <div class="flex items-center gap-2">
          <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600"><i class="fa-solid fa-chevron-left"></i> 上個月</button>
          <h2 id="month-title" class="text-xl font-bold text-slate-800 min-w-[120px] text-center"></h2>
          <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600">下個月 <i class="fa-solid fa-chevron-right"></i></button>
        </div>

        <!-- 篩選分類 -->
        <div class="flex items-center gap-1 text-xs">
          <span class="text-slate-500 font-medium mr-1">分類篩選：</span>
          <button onclick="filterCategory('all')" class="px-2.5 py-1 rounded-full bg-slate-800 text-white font-medium">全部</button>
          <button onclick="filterCategory('work')" class="px-2.5 py-1 rounded-full bg-blue-100 text-blue-700 font-medium">工作</button>
          <button onclick="filterCategory('personal')" class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 font-medium">個人</button>
          <button onclick="filterCategory('important')" class="px-2.5 py-1 rounded-full bg-red-100 text-red-700 font-medium">重要</button>
          <button onclick="filterCategory('leisure')" class="px-2.5 py-1 rounded-full bg-amber-100 text-amber-700 font-medium">休閒</button>
        </div>
      </div>

      <!-- 月曆網格 -->
      <div class="bg-white rounded-xl shadow-md p-4">
        <div class="grid grid-cols-7 gap-1 text-center font-bold text-slate-500 mb-2 text-sm">
          <div class="text-red-500">日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="text-blue-500">六</div>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- 新增行程 -->
        <div class="bg-white rounded-xl shadow-md p-5 md:col-span-1">
          <h3 class="text-lg font-bold mb-4 text-slate-800"><i class="fa-solid fa-plus-circle text-blue-600"></i> 新增行程</h3>
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">日期</label>
              <input type="date" id="event-date" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">時間（選填，提醒通知用）</label>
              <input type="time" id="event-time" value="09:00" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">標題</label>
              <input type="text" id="event-title" placeholder="例如：專案會議" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">分類標籤</label>
              <select id="event-category" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none">
                <option value="work">💼 工作 (藍)</option>
                <option value="personal">🏠 個人 (綠)</option>
                <option value="important">🚨 重要 (紅)</option>
                <option value="leisure">☕ 休閒 (黃)</option>
              </select>
            </div>
            <button onclick="addEvent()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition shadow-sm">新增行程與設定通知</button>
          </div>
        </div>

        <!-- 行程列表 -->
        <div class="bg-white rounded-xl shadow-md p-5 md:col-span-2">
          <h3 class="text-lg font-bold mb-4 text-slate-800"><i class="fa-solid fa-list-check text-blue-600"></i> 行程列表</h3>
          <div id="event-list" class="space-y-2 max-h-96 overflow-y-auto pr-1"></div>
        </div>
      </div>
    </main>

    <!-- 未登入提示 -->
    <div id="notice-box" class="bg-white rounded-xl shadow-md p-8 text-center my-10">
      <i class="fa-solid fa-lock text-3xl text-blue-600 mb-3"></i>
      <h2 class="text-xl font-bold text-slate-800 mb-2">請先登入或註冊</h2>
      <p class="text-slate-500 text-sm">登入後即可同步儲存您的行事曆與開啟提醒通知。</p>
    </div>
  </div>

  <script>
    // Firebase 設定檔
    const firebaseConfig = {
      apiKey: "AIzaSyBZ9s5Ku8aEzaVEmk_7ztbIiHXI6qmz5H0",
      authDomain: "my-project-zack0512.firebaseapp.com",
      databaseURL: "https://my-project-zack0512-default-rtdb.firebaseio.com",
      projectId: "my-project-zack0512",
      storageBucket: "my-project-zack0512.firebasestorage.app",
      messagingSenderId: "972310414233",
      appId: "1:972310414233:web:39c19e88ee71c22b530908",
      measurementId: "G-BVFSR4Z3B5"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let userEvents = {};
    let currentDate = new Date();
    let currentCategoryFilter = 'all';
    let notifiedEventIds = new Set();

    // 分類顏色設定
    const categoryStyles = {
      work: { name: '工作', bg: 'bg-blue-100', text: 'text-blue-800', border: 'border-blue-500' },
      personal: { name: '個人', bg: 'bg-emerald-100', text: 'text-emerald-800', border: 'border-emerald-500' },
      important: { name: '重要', bg: 'bg-red-100', text: 'text-red-800', border: 'border-red-500' },
      leisure: { name: '休閒', bg: 'bg-amber-100', text: 'text-amber-800', border: 'border-amber-500' }
    };

    function showAlert(msg, isError = false) {
      const box = document.getElementById('alert-box');
      box.innerText = msg;
      box.className = `mb-4 p-3 rounded-lg text-sm font-medium ${isError ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-800'}`;
      box.classList.remove('hidden');
    }

    // 請求瀏覽器通知權限
    function requestNotificationPermission() {
      if (!("Notification" in window)) {
        alert("您的瀏覽器不支援桌面通知功能。");
        return;
      }
      Notification.requestPermission().then(permission => {
        if (permission === "granted") {
          showAlert("通知功能已開啟！當行程時間到達時將發送提示。");
          document.getElementById('btn-notify').innerHTML = `<i class="fa-solid fa-bell-check text-emerald-600"></i> 通知已開啟`;
        } else {
          showAlert("您拒絕了通知權限，將無法收到提醒。", true);
        }
      });
    }

    // 檢查並發送即時通知
    function checkAndSendNotifications() {
      if (!currentUser || !("Notification" in window) || Notification.permission !== "granted") return;

      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = String(now.getMonth() + 1).padStart(2, '0');
      const currentDateStr = String(now.getDate()).padStart(2, '0');
      const todayStr = `${currentYear}-${currentMonth}-${currentDateStr}`;
      const currentTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      Object.values(userEvents).forEach(ev => {
        if (ev.date === todayStr && ev.time === currentTimeStr && !notifiedEventIds.has(ev.id)) {
          notifiedEventIds.add(ev.id);
          const cat = categoryStyles[ev.category] || categoryStyles.work;
          new Notification(`行事曆提醒：${ev.title}`, {
            body: `【${cat.name}】時間：${ev.time}`,
            icon: 'https://cdn-icons-png.flaticon.com/512/2693/2693507.png'
          });
        }
      });
    }

    // 每 30 秒定期檢查一次行程時間發送通知
    setInterval(checkAndSendNotifications, 30000);

    // 監聽登入狀態
    auth.onAuthStateChanged((user) => {
      currentUser = user;
      if (user) {
        document.getElementById('user-email').innerText = user.email;
        document.getElementById('logged-out-box').classList.add('hidden');
        document.getElementById('logged-in-box').classList.remove('hidden');
        document.getElementById('app-main').classList.remove('hidden');
        document.getElementById('notice-box').classList.add('hidden');

        db.ref('events/' + user.uid).on('value', (snapshot) => {
          userEvents = snapshot.val() || {};
          renderCalendar();
          renderList();
          checkAndSendNotifications();
        });
      } else {
        document.getElementById('logged-out-box').classList.remove('hidden');
        document.getElementById('logged-in-box').classList.add('hidden');
        document.getElementById('app-main').classList.add('hidden');
        document.getElementById('notice-box').classList.remove('hidden');
        userEvents = {};
      }
    });

    // 註冊 / 登入 / 登出
    function handleRegister() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return showAlert('請輸入電子郵件與密碼', true);
      auth.createUserWithEmailAndPassword(email, password)
        .then(() => showAlert('註冊成功並已登入！'))
        .catch((err) => showAlert('註冊失敗：' + err.message, true));
    }

    function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return showAlert('請輸入電子郵件與密碼', true);
      auth.signInWithEmailAndPassword(email, password)
        .then(() => showAlert('登入成功！'))
        .catch((err) => showAlert('登入失敗：帳號或密碼錯誤', true));
    }

    function handleLogout() {
      auth.signOut();
      showAlert('已登出');
    }

    // 新增行程
    function addEvent() {
      if (!currentUser) return;
      const date = document.getElementById('event-date').value;
      const time = document.getElementById('event-time').value || '09:00';
      const title = document.getElementById('event-title').value.trim();
      const category = document.getElementById('event-category').value;

      if (!date || !title) return showAlert('請填寫日期與標題', true);

      const id = Date.now().toString();
      db.ref(`events/${currentUser.uid}/${id}`).set({ id, date, time, title, category })
        .then(() => {
          showAlert('行程與通知已同步至雲端');
          document.getElementById('event-title').value = '';
        })
        .catch((err) => showAlert('儲存失敗：' + err.message, true));
    }

    // 刪除行程
    function deleteEvent(id) {
      if (!currentUser) return;
      db.ref(`events/${currentUser.uid}/${id}`).remove().then(() => showAlert('已刪除行程'));
    }

    // 分類篩選
    function filterCategory(cat) {
      currentCategoryFilter = cat;
      renderCalendar();
      renderList();
    }

    // 月曆渲染
    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById('month-title').innerText = `${year} 年 ${month + 1} 月`;

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div class="h-20 bg-slate-50/50 rounded-lg"></div>`;
      }

      const todayStr = new Date().toISOString().split('T')[0];

      for (let day = 1; day <= lastDate; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = dateStr === todayStr;

        let events = Object.values(userEvents).filter(e => e.date === dateStr);
        if (currentCategoryFilter !== 'all') {
          events = events.filter(e => e.category === currentCategoryFilter);
        }

        grid.innerHTML += `
          <div onclick="document.getElementById('event-date').value='${dateStr}'" 
               class="h-20 border border-slate-100 rounded-lg p-1.5 cursor-pointer hover:border-blue-300 transition flex flex-col justify-between ${isToday ? 'bg-blue-50 border-blue-400' : 'bg-white'}">
            <div class="text-xs font-bold ${isToday ? 'text-blue-600' : 'text-slate-700'}">${day}</div>
            <div class="space-y-1 overflow-hidden">
              ${events.slice(0, 2).map(e => {
                const cat = categoryStyles[e.category] || categoryStyles.work;
                return `<div class="text-[10px] ${cat.bg}${cat.text} rounded px-1 truncate font-medium">${e.time \vert{}\vert{} ''}${e.title}</div>`;
              }).join('')}
              ${events.length > 2 ? `<div class="text-[9px] text-slate-400">+${events.length - 2}更多</div>` : ''}
            </div>
          </div>
        `;
      }
    }

    // 列表渲染
    function renderList() {
      const list = document.getElementById('event-list');
      let arr = Object.values(userEvents).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

      if (currentCategoryFilter !== 'all') {
        arr = arr.filter(e => e.category === currentCategoryFilter);
      }

      if (arr.length === 0) {
        list.innerHTML = `<p class="text-slate-400 text-sm py-4 text-center">目前沒有符合的行程。</p>`;
        return;
      }

      list.innerHTML = arr.map(e => {
        const cat = categoryStyles[e.category] || categoryStyles.work;
        return `
          <div class="p-3 bg-slate-50 border-l-4 ${cat.border} rounded-r-lg flex justify-between items-center hover:bg-slate-100 transition">
            <div class="space-y-0.5">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold ${cat.bg} ${cat.text} px-1.5 py-0.5 rounded">${cat.name}</span>
                <span class="font-semibold text-slate-800 text-sm">${e.title}</span>
              </div>
              <span class="text-xs text-slate-500 block"><i class="fa-regular fa-clock"></i> ${e.date} ${e.time || ''}</span>
            </div>
            <button onclick="deleteEvent('${e.id}')" class="text-slate-400 hover:text-red-500 p-1.5"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        `;
      }).join('');
    }

    function changeMonth(step) {
      currentDate.setMonth(currentDate.getMonth() + step);
      renderCalendar();
    }

    document.getElementById('event-date').value = new Date().toISOString().split('T')[0];
  </script>
</body>
</html>
