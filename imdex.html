<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>沙沙雲端行事曆</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <div id="app" class="max-w-4xl mx-auto p-4 md:p-6">
    <!-- 頂部標題與登入區 -->
    <header class="bg-white rounded-xl shadow-md p-5 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 text-white p-3 rounded-lg shadow-sm">
          <i class="fa-solid fa-calendar-days text-2xl"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-slate-800">雲端行事曆</h1>
          <p class="text-xs text-slate-500">Firebase 即時同步版本</p>
        </div>
      </div>

      <!-- 未登入區塊 -->
      <div id="auth-logged-out" class="w-full md:w-auto">
        <form id="auth-form" class="flex flex-col sm:flex-row gap-2 items-center">
          <input type="email" id="auth-email" placeholder="電子郵件" required class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm w-full sm:w-40 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <input type="password" id="auth-password" placeholder="密碼(至少6碼)" required class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm w-full sm:w-36 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <div class="flex gap-2 w-full sm:w-auto">
            <button type="submit" id="btn-login" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg text-sm transition flex-1 sm:flex-none">登入</button>
            <button type="button" id="btn-register" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-sm transition flex-1 sm:flex-none">註冊</button>
          </div>
        </form>
      </div>

      <!-- 已登入區塊 -->
      <div id="auth-logged-in" class="hidden flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
        <div class="text-right">
          <span id="user-display-email" class="text-sm font-semibold text-slate-700 block"></span>
          <span class="text-xs text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200"><i class="fa-solid fa-cloud"></i> 已雲端連線</span>
        </div>
        <button id="btn-logout" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-sm transition font-medium">登出</button>
      </div>
    </header>

    <!-- 訊息提示條 -->
    <div id="toast" class="hidden mb-4 p-3 rounded-lg text-sm transition-all duration-300 flex justify-between items-center">
      <span id="toast-message"></span>
      <button onclick="document.getElementById('toast').classList.add('hidden')" class="text-slate-400 hover:text-slate-600 ml-2">&times;</button>
    </div>

    <!-- 主要內容區 -->
    <main id="main-content" class="hidden space-y-6">
      
      <!-- 月份切換與控制 -->
      <div class="bg-white rounded-xl shadow-md p-4 flex justify-between items-center">
        <button id="btn-prev-month" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition"><i class="fa-solid fa-chevron-left"></i> 上個月</button>
        <h2 id="current-month-year" class="text-xl font-bold text-slate-800"></h2>
        <button id="btn-next-month" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition">下個月 <i class="fa-solid fa-chevron-right"></i></button>
      </div>

      <!-- 月曆表格 -->
      <div class="bg-white rounded-xl shadow-md overflow-hidden p-4">
        <div class="grid grid-cols-7 gap-1 text-center font-bold text-slate-500 mb-2 text-sm">
          <div class="text-red-500">日</div>
          <div>一</div>
          <div>二</div>
          <div>三</div>
          <div>四</div>
          <div>五</div>
          <div class="text-blue-500">六</div>
        </div>
        <div id="calendar-days" class="grid grid-cols-7 gap-1"></div>
      </div>

      <!-- 新增行程與列表 -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- 新增行程表單 -->
        <div class="bg-white rounded-xl shadow-md p-5 md:col-span-1">
          <h3 class="text-lg font-bold mb-4 text-slate-800 flex items-center gap-2"><i class="fa-solid fa-plus-circle text-blue-600"></i> 新增行程</h3>
          <form id="add-event-form" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">日期</label>
              <input type="date" id="event-date" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">行程標題</label>
              <input type="text" id="event-title" placeholder="例如：團隊會議" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">時間（選填）</label>
              <input type="time" id="event-time" value="09:00" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition shadow-sm">新增至雲端</button>
          </form>
        </div>

        <!-- 行程列表 -->
        <div class="bg-white rounded-xl shadow-md p-5 md:col-span-2">
          <h3 class="text-lg font-bold mb-4 text-slate-800 flex items-center gap-2"><i class="fa-solid fa-list-check text-blue-600"></i> 我的行程列表</h3>
          <div id="events-list" class="space-y-2 max-h-80 overflow-y-auto pr-1">
            <!-- 動態渲染行程 -->
          </div>
        </div>
      </div>
    </main>

    <!-- 未登入提示遮罩 -->
    <div id="logged-out-notice" class="bg-white rounded-xl shadow-md p-8 text-center my-10">
      <div class="inline-block bg-blue-50 p-4 rounded-full text-blue-600 mb-4">
        <i class="fa-solid fa-lock text-3xl"></i>
      </div>
      <h2 class="text-xl font-bold text-slate-800 mb-2">請先登入帳號</h2>
      <p class="text-slate-500 text-sm max-w-md mx-auto">登入或註冊帳號後，您的行程資料將會即時同步至雲端資料庫，跨裝置不遺失。</p>
    </div>
  </div>

  <!-- Firebase Modular SDKs via CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getDatabase, 
      ref, 
      set, 
      onValue, 
      remove 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 您的 Firebase 設定檔
    const firebaseConfig = {
      apiKey: "AIzaSyBZ9s5Ku8aEzaVEmk_7ztbIiHXI6qmz5H0",
      authDomain: "my-project-zack0512.firebaseapp.com",
      databaseURL: "https://my-project-zack0512-default-rtdb.firebaseio.com",
      projectId: "my-project-zack0512",
      storageBucket: "my-project-zack0512.firebasestorage.app",
      messagingSenderId: "972310414233",
      appId: "1:972310414233:web:39c19e88ee71c22b530908",
      measurementId: "G-BVFSR4Z3B5"
    };

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // 全域變數
    let currentUser = null;
    let userEvents = {};
    let currentDate = new Date();

    // UI 元素引照
    const authLoggedOut = document.getElementById('auth-logged-out');
    const authLoggedIn = document.getElementById('auth-logged-in');
    const userDisplayEmail = document.getElementById('user-display-email');
    const mainContent = document.getElementById('main-content');
    const loggedOutNotice = document.getElementById('logged-out-notice');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toast-message');

    // 顯示提示訊息
    function showToast(msg, isError = false) {
      toastMessage.innerText = msg;
      toast.className = `mb-4 p-3 rounded-lg text-sm transition-all duration-300 flex justify-between items-center ${
        isError ? 'bg-red-100 text-red-700 border border-red-200' : 'bg-emerald-100 text-emerald-800 border border-emerald-200'
      }`;
      toast.classList.remove('hidden');
    }

    // 監聽使用者驗證狀態
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        userDisplayEmail.innerText = user.email;
        authLoggedOut.classList.add('hidden');
        authLoggedIn.classList.remove('hidden');
        mainContent.classList.remove('hidden');
        loggedOutNotice.classList.add('hidden');

        // 從 Realtime Database 載入資料
        const eventsRef = ref(db, `events/${user.uid}`);
        onValue(eventsRef, (snapshot) => {
          userEvents = snapshot.val() || {};
          renderCalendar();
          renderEventsList();
        });
      } else {
        authLoggedOut.classList.remove('hidden');
        authLoggedIn.classList.add('hidden');
        mainContent.classList.add('hidden');
        loggedOutNotice.classList.remove('hidden');
        userEvents = {};
      }
    });

    // 登入
    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
        showToast('登入成功！');
      } catch (err) {
        showToast('登入失敗：' + getErrorMessage(err.code), true);
      }
    });

    // 註冊
    document.getElementById('btn-register').addEventListener('click', async () => {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      if (!email || !password) {
        showToast('請填寫電子郵件與密碼', true);
        return;
      }
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        showToast('註冊成功並已登入！');
      } catch (err) {
        showToast('註冊失敗：' + getErrorMessage(err.code), true);
      }
    });

    // 登出
    document.getElementById('btn-logout').addEventListener('click', () => {
      signOut(auth);
      showToast('已安全登出');
    });

    // 錯誤轉中文提示
    function getErrorMessage(code) {
      switch (code) {
        case 'auth/invalid-credential':
        case 'auth/user-not-found':
        case 'auth/wrong-password':
          return '帳號或密碼錯誤';
        case 'auth/email-already-in-use':
          return '該 Email 已被註冊';
        case 'auth/weak-password':
          return '密碼強度不足（至少需要6碼）';
        case 'auth/operation-not-allowed':
          return '後台未開放 Email 登入';
        default:
          return code;
      }
    }

    // 新增行程
    document.getElementById('add-event-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const date = document.getElementById('event-date').value;
      const title = document.getElementById('event-title').value;
      const time = document.getElementById('event-time').value;

      const eventId = Date.now().toString();
      const newEvent = { id: eventId, date, title, time };

      try {
        await set(ref(db, `events/${currentUser.uid}/${eventId}`), newEvent);
        showToast('行程已同步至雲端');
        document.getElementById('event-title').value = '';
      } catch (err) {
        showToast('儲存失敗，請檢查資料庫 Rules 權限', true);
      }
    });

    // 刪除行程（全域函式）
    window.deleteEvent = async (eventId) => {
      if (!currentUser) return;
      try {
        await remove(ref(db, `events/${currentUser.uid}/${eventId}`));
        showToast('已刪除行程');
      } catch (err) {
        showToast('刪除失敗', true);
      }
    };

    // 渲染月曆
    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('current-month-year').innerText = `${year} 年 ${month + 1} 月`;

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      const daysContainer = document.getElementById('calendar-days');
      daysContainer.innerHTML = '';

      // 補前空白天數
      for (let i = 0; i < firstDay; i++) {
        daysContainer.innerHTML += `<div class="h-20 bg-slate-50/50 rounded-lg"></div>`;
      }

      // 渲染當月日期
      const todayStr = new Date().toISOString().split('T')[0];

      for (let day = 1; day <= lastDate; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = dateStr === todayStr;

        // 計算當日行程數量
        const dayEvents = Object.values(userEvents).filter(e => e.date === dateStr);

        daysContainer.innerHTML += `
          <div onclick="document.getElementById('event-date').value='${dateStr}'" 
               class="h-20 border border-slate-100 rounded-lg p-1.5 cursor-pointer hover:border-blue-300 transition flex flex-col justify-between ${isToday ? 'bg-blue-50/80 border-blue-400' : 'bg-white'}">
            <div class="text-xs font-bold ${isToday ? 'text-blue-600' : 'text-slate-700'}">${day}</div>
            <div class="space-y-1 overflow-hidden">
              ${dayEvents.slice(0, 2).map(e => `
                <div class="text-[10px] bg-blue-100 text-blue-800 rounded px-1 py-0.5 truncate">${e.time \vert{}\vert{} ''}${e.title}</div>
              `).join('')}
              ${dayEvents.length > 2 ? `<div class="text-[9px] text-slate-400">+${dayEvents.length - 2}更多</div>` : ''}
            </div>
          </div>
        `;
      }
    }

    // 渲染行程列表
    function renderEventsList() {
      const listContainer = document.getElementById('events-list');
      const eventsArray = Object.values(userEvents).sort((a, b) => a.date.localeCompare(b.date));

      if (eventsArray.length === 0) {
        listContainer.innerHTML = `<p class="text-slate-400 text-sm py-4 text-center">目前尚無行程。</p>`;
        return;
      }

      listContainer.innerHTML = eventsArray.map(e => `
        <div class="p-3 bg-slate-50 border-l-4 border-blue-500 rounded-r-lg flex justify-between items-center hover:bg-slate-100 transition">
          <div>
            <span class="font-semibold text-slate-800 text-sm block">${e.title}</span>
            <span class="text-xs text-slate-500"><i class="fa-regular fa-clock"></i> ${e.date} ${e.time || ''}</span>
          </div>
          <button onclick="deleteEvent('${e.id}')" class="text-slate-400 hover:text-red-500 p-1.5 transition">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      `).join('');
    }

    // 月份切換按鈕
    document.getElementById('btn-prev-month').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });
    document.getElementById('btn-next-month').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    // 預設今日日期
    document.getElementById('event-date').value = new Date().toISOString().split('T')[0];
  </script>
</body>
  </html>
